name: Keep API awake

# Render (plan gratis) duerme el servicio tras ~15 min sin tráfico y el primer
# request tarda ~40 s en despertar. Este ping cada 10 min lo mantiene activo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health
        run: |
          curl --fail --silent --show-error \
            --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors \
            --write-out "HTTP %{http_code} en %{time_total}s\n" --output /dev/null \
            https://inventory-gftech.onrender.com/health
