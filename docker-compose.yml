services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gftech
      POSTGRES_PASSWORD: gftech
      POSTGRES_DB: gftech_inventario
    volumes:
      - gftech_pg_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gftech -d gftech_inventario"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://gftech:gftech@db:5432/gftech_inventario
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8010/api/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8010/api/v1
    depends_on:
      - backend
    ports:
      - "3010:3000"

volumes:
  gftech_pg_data:
